<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&amp;family=Outfit:wght@600;800&amp;display=swap');
      
      .canvas-bg { fill: #FAF8F5; }
      .text-title { font-family: 'Prompt', sans-serif; font-size: 28px; font-weight: 800; fill: #2D231E; }
      .text-subtitle { font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 500; fill: #6B5E55; }
      .table-header { font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 700; }
      .field-name { font-family: 'Prompt', monospace; font-size: 13px; font-weight: 600; fill: #2D231E; }
      .field-type { font-family: 'Prompt', monospace; font-size: 12px; font-weight: 400; fill: #6B5E55; }
      .badge-pk { font-family: 'Prompt', sans-serif; font-size: 10px; font-weight: 800; fill: #FFFFFF; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D231E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="960" class="canvas-bg"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 40)">
    <rect width="1480" height="85" rx="20" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="45" cy="42.5" r="22" fill="#D0DEC6"/>
    <text x="35" y="50" font-size="22">🗄️</text>
    <text x="80" y="38" class="text-title">MATCHA — DATABASE ARCHITECTURE &amp; ERD DIAGRAM</text>
    <text x="80" y="64" class="text-subtitle">แบบจำลองความสัมพันธ์ของฐานข้อมูล (Entity-Relationship Diagram &amp; MongoDB Collections) สำหรับแพลตฟอร์มแฟชั่นและกระเป๋า Personal Color</text>
    
    <rect x="1300" y="24" width="150" height="36" rx="10" fill="#2D5A27"/>
    <text x="1375" y="47" text-anchor="middle" fill="#FFFFFF" font-family="'Prompt', sans-serif" font-size="11" font-weight="700">✦ DATABASE SCHEMA</text>
  </g>

  <!-- TABLE 1: USER Collection (Top Left) -->
  <g transform="translate(60, 155)">
    <rect width="320" height="310" rx="18" fill="#FFFFFF" stroke="#1A365D" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="46" rx="18" fill="#1A365D"/>
    <rect y="28" width="320" height="18" fill="#1A365D"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">👤 USER Collection (ผู้ใช้ &amp; สมาชิก)</text>
    
    <g transform="translate(20, 70)">
      <!-- Field 1: _id -->
      <rect x="0" y="0" width="28" height="18" rx="4" fill="#BC5A36"/>
      <text x="5" y="13" class="badge-pk">PK</text>
      <text x="36" y="14" class="field-name">_id</text>
      <text x="210" y="14" class="field-type">ObjectId</text>
      
      <!-- Field 2 -->
      <text x="36" y="40" class="field-name">firstName</text>
      <text x="210" y="40" class="field-type">String</text>
      
      <!-- Field 3 -->
      <text x="36" y="65" class="field-name">lastName</text>
      <text x="210" y="65" class="field-type">String</text>
      
      <!-- Field 4 -->
      <text x="36" y="90" class="field-name">email</text>
      <text x="210" y="90" class="field-type">String [Unique]</text>
      
      <!-- Field 5 -->
      <text x="36" y="115" class="field-name">passwordHash</text>
      <text x="210" y="115" class="field-type">String (Bcrypt)</text>
      
      <!-- Field 6 -->
      <text x="36" y="140" class="field-name">role</text>
      <text x="210" y="140" class="field-type">"Member" | "Admin"</text>
      
      <!-- Field 7 -->
      <text x="36" y="165" class="field-name">personalColorType</text>
      <text x="210" y="165" class="field-type">"Autumn Warm"...</text>
      
      <!-- Field 8 -->
      <text x="36" y="190" class="field-name">phone</text>
      <text x="210" y="190" class="field-type">String</text>
      
      <!-- Field 9 -->
      <text x="36" y="215" class="field-name">createdAt</text>
      <text x="210" y="215" class="field-type">Date</text>
    </g>
  </g>

  <!-- TABLE 2: ORDER Collection (Bottom Left) -->
  <g transform="translate(60, 500)">
    <rect width="360" height="380" rx="18" fill="#FFFFFF" stroke="#BC5A36" stroke-width="2" filter="url(#shadow)"/>
    <rect width="360" height="46" rx="18" fill="#BC5A36"/>
    <rect y="28" width="360" height="18" fill="#BC5A36"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">📦 ORDER Collection (คำสั่งซื้อ)</text>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="28" height="18" rx="4" fill="#BC5A36"/>
      <text x="5" y="13" class="badge-pk">PK</text>
      <text x="36" y="14" class="field-name">_id</text>
      <text x="230" y="14" class="field-type">ObjectId</text>
      
      <rect x="0" y="25" width="28" height="18" rx="4" fill="#1A365D"/>
      <text x="5" y="38" class="badge-pk">FK</text>
      <text x="36" y="39" class="field-name">userId</text>
      <text x="230" y="39" class="field-type">ObjectId (->User)</text>
      
      <text x="36" y="65" class="field-name">orderNumber</text>
      <text x="230" y="65" class="field-type">String (#MTA-...)</text>
      
      <text x="36" y="90" class="field-name" fill="#2D5A27">purchaseDateTime</text>
      <text x="230" y="90" class="field-type">Date [Mandatory]</text>
      
      <text x="36" y="115" class="field-name">customer</text>
      <text x="230" y="115" class="field-type">Object (Contact)</text>
      
      <text x="36" y="140" class="field-name">shippingAddress</text>
      <text x="230" y="140" class="field-type">Object (Address)</text>
      
      <text x="36" y="165" class="field-name">pricing</text>
      <text x="230" y="165" class="field-type">{subtotal, ship, total}</text>
      
      <text x="36" y="190" class="field-name">paymentMethod</text>
      <text x="230" y="190" class="field-type">"visa" | "qr" | "cod"</text>
      
      <text x="36" y="215" class="field-name">status</text>
      <text x="230" y="215" class="field-type">"Delivered"...</text>
      
      <text x="36" y="240" class="field-name">items</text>
      <text x="230" y="240" class="field-type">Array of OrderItems</text>
    </g>
  </g>

  <!-- TABLE 3: PRODUCT Collection (Top Center) -->
  <g transform="translate(480, 155)">
    <rect width="380" height="340" rx="18" fill="#FFFFFF" stroke="#2D5A27" stroke-width="2" filter="url(#shadow)"/>
    <rect width="380" height="46" rx="18" fill="#2D5A27"/>
    <rect y="28" width="380" height="18" fill="#2D5A27"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">👕 PRODUCT Collection (เสื้อผ้า &amp; กระเป๋า)</text>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="28" height="18" rx="4" fill="#BC5A36"/>
      <text x="5" y="13" class="badge-pk">PK</text>
      <text x="36" y="14" class="field-name">_id</text>
      <text x="240" y="14" class="field-type">ObjectId</text>
      
      <text x="36" y="40" class="field-name">name</text>
      <text x="240" y="40" class="field-type">String</text>
      
      <text x="36" y="65" class="field-name">description</text>
      <text x="240" y="65" class="field-type">String</text>
      
      <text x="36" y="90" class="field-name">category</text>
      <text x="240" y="90" class="field-type">"Tops" | "Bags" | "Outer"...</text>
      
      <text x="36" y="115" class="field-name">price</text>
      <text x="240" y="115" class="field-type">Number (USD)</text>
      
      <text x="36" y="140" class="field-name" fill="#2D5A27">personalColorSeason</text>
      <text x="240" y="140" class="field-type">"Autumn Warm"...</text>
      
      <text x="36" y="165" class="field-name">tag</text>
      <text x="240" y="165" class="field-type">"Best Seller" | "New"...</text>
      
      <text x="36" y="190" class="field-name">fit</text>
      <text x="240" y="190" class="field-type">"Boxy" | "One Size"...</text>
      
      <text x="36" y="215" class="field-name">inStock</text>
      <text x="240" y="215" class="field-type">Boolean</text>
      
      <text x="36" y="240" class="field-name">variants</text>
      <text x="240" y="240" class="field-type">Array of ColorVariants</text>
    </g>
  </g>

  <!-- TABLE 4: COLOR_VARIANT Sub-Schema (Top Right) -->
  <g transform="translate(930, 155)">
    <rect width="320" height="230" rx="18" fill="#FFFFFF" stroke="#556B2F" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="46" rx="18" fill="#556B2F"/>
    <rect y="28" width="320" height="18" fill="#556B2F"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">🎨 COLOR_VARIANT (เฉดสีและรูปภาพ)</text>
    
    <g transform="translate(20, 70)">
      <text x="20" y="20" class="field-name">color</text>
      <text x="180" y="20" class="field-type">String ("Matcha Olive")</text>
      
      <text x="20" y="50" class="field-name">colorHex</text>
      <text x="180" y="50" class="field-type">String ("#556B2F")</text>
      
      <text x="20" y="80" class="field-name" fill="#2D5A27">colorTone</text>
      <text x="180" y="80" class="field-type">"Warm" | "Cool"</text>
      
      <text x="20" y="110" class="field-name">image</text>
      <text x="180" y="110" class="field-type">String (URL)</text>
      
      <text x="20" y="140" class="field-name">stockQuantity</text>
      <text x="180" y="140" class="field-type">Number (pcs)</text>
    </g>
  </g>

  <!-- TABLE 5: ORDER_ITEM Sub-Schema (Bottom Center) -->
  <g transform="translate(480, 540)">
    <rect width="340" height="270" rx="18" fill="#FFFFFF" stroke="#556B2F" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="46" rx="18" fill="#556B2F"/>
    <rect y="28" width="340" height="18" fill="#556B2F"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">🛍️ ORDER_ITEM (รายการสินค้าในออเดอร์)</text>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="28" height="18" rx="4" fill="#1A365D"/>
      <text x="5" y="13" class="badge-pk">FK</text>
      <text x="36" y="14" class="field-name">productId</text>
      <text x="200" y="14" class="field-type">ObjectId (->Product)</text>
      
      <text x="36" y="40" class="field-name">productName</text>
      <text x="200" y="40" class="field-type">String</text>
      
      <text x="36" y="65" class="field-name">selectedColor</text>
      <text x="200" y="65" class="field-type">String</text>
      
      <text x="36" y="90" class="field-name">selectedSize</text>
      <text x="200" y="90" class="field-type">String ("M" | "OS")</text>
      
      <text x="36" y="115" class="field-name">quantity</text>
      <text x="200" y="115" class="field-type">Number</text>
      
      <text x="36" y="140" class="field-name">unitPrice</text>
      <text x="200" y="140" class="field-type">Number</text>
      
      <text x="36" y="165" class="field-name">itemImage</text>
      <text x="200" y="165" class="field-type">String (URL)</text>
    </g>
  </g>

  <!-- TABLE 6: COUPON Collection (Bottom Right) -->
  <g transform="translate(930, 460)">
    <rect width="320" height="230" rx="18" fill="#FFFFFF" stroke="#D4A338" stroke-width="2" filter="url(#shadow)"/>
    <rect width="320" height="46" rx="18" fill="#D4A338"/>
    <rect y="28" width="320" height="18" fill="#D4A338"/>
    <text x="20" y="30" class="table-header" fill="#FFFFFF">🏷️ COUPON (โค้ดส่วนลดโปรโมชัน)</text>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="28" height="18" rx="4" fill="#BC5A36"/>
      <text x="5" y="13" class="badge-pk">PK</text>
      <text x="36" y="14" class="field-name">code</text>
      <text x="180" y="14" class="field-type">String ("MATCHA15")</text>
      
      <text x="36" y="40" class="field-name">discountPercent</text>
      <text x="180" y="40" class="field-type">Number (15%)</text>
      
      <text x="36" y="65" class="field-name">couponType</text>
      <text x="180" y="65" class="field-type">"percent" | "ship"</text>
      
      <text x="36" y="90" class="field-name">label</text>
      <text x="180" y="90" class="field-type">String ("15% OFF")</text>
      
      <text x="36" y="115" class="field-name">isActive</text>
      <text x="180" y="115" class="field-type">Boolean</text>
    </g>
  </g>

  <!-- CONNECTOR RELATIONSHIP ARROWS -->
  <!-- User -> Order (1 : N) -->
  <path d="M 220 465 L 220 500" fill="none" stroke="#1A365D" stroke-width="2.5" stroke-dasharray="4"/>
  <circle cx="220" cy="465" r="4" fill="#1A365D"/>
  <polygon points="220,500 215,490 225,490" fill="#1A365D"/>
  <rect x="225" y="470" width="70" height="20" rx="4" fill="#F0F4F9" stroke="#1A365D"/>
  <text x="230" y="484" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#1A365D">1 : N สั่งซื้อ</text>

  <!-- Product -> Variant (1 : N) -->
  <path d="M 860 270 L 930 270" fill="none" stroke="#2D5A27" stroke-width="2.5"/>
  <circle cx="860" cy="270" r="4" fill="#2D5A27"/>
  <polygon points="930,270 920,265 920,275" fill="#2D5A27"/>
  <text x="870" y="260" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#2D5A27">1 : N มีเฉดสี</text>

  <!-- Order -> OrderItem (1 : N) -->
  <path d="M 420 675 L 480 675" fill="none" stroke="#BC5A36" stroke-width="2.5"/>
  <circle cx="420" cy="675" r="4" fill="#BC5A36"/>
  <polygon points="480,675 470,670 470,680" fill="#BC5A36"/>
  <text x="430" y="665" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#BC5A36">1 : N บรรจุ</text>

  <!-- Product -> OrderItem (1 : N Ordered As) -->
  <path d="M 670 495 L 670 540" fill="none" stroke="#556B2F" stroke-width="2.5"/>
  <circle cx="670" cy="495" r="4" fill="#556B2F"/>
  <polygon points="670,540 665,530 675,530" fill="#556B2F"/>
  <text x="680" y="520" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#556B2F">สั่งซื้อเป็น</text>

</svg>
