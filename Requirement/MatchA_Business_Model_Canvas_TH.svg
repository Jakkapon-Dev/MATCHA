<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&amp;family=Outfit:wght@600;800&amp;display=swap');
      
      .canvas-bg { fill: #FAF8F5; }
      .text-title { font-family: 'Prompt', sans-serif; font-size: 28px; font-weight: 800; fill: #2D231E; }
      .text-subtitle { font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 500; fill: #6B5E55; }
      .box-header { font-family: 'Prompt', sans-serif; font-size: 17px; font-weight: 700; }
      .box-body { font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 400; fill: #2D231E; line-height: 1.6; }
      .box-bullet { font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 600; fill: #2D5A27; }
      .badge-text { font-family: 'Prompt', sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D231E" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="960" class="canvas-bg"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 40)">
    <rect width="1480" height="85" rx="20" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="45" cy="42.5" r="22" fill="#D0DEC6"/>
    <text x="35" y="50" font-size="22">🍵</text>
    <text x="80" y="38" class="text-title">MATCHA — BUSINESS MODEL CANVAS (ภาษาไทย)</text>
    <text x="80" y="64" class="text-subtitle">แพลตฟอร์มอีคอมเมิร์ซจำหน่ายเสื้อผ้า กระเป๋า และสินค้าแฟชั่นคัดสรรตามโทนสีผิว Personal Color (Spring, Summer, Autumn, Winter)</text>
    
    <!-- Right Badge -->
    <rect x="1270" y="24" width="180" height="36" rx="10" fill="#2D5A27"/>
    <text x="1360" y="47" text-anchor="middle" fill="#FFFFFF" class="badge-text">✦ PERSONAL COLOR ARCHIVE</text>
  </g>

  <!-- MAIN 9-BLOCK CANVAS GRID -->
  <!-- 1. Key Partners (พันธมิตรหลัก) -->
  <g transform="translate(60, 145)">
    <rect width="280" height="490" rx="18" fill="#FFFFFF" stroke="#2D5A27" stroke-width="2" filter="url(#shadow)"/>
    <rect width="280" height="48" rx="18" fill="#EBF4E8"/>
    <rect y="30" width="280" height="18" fill="#EBF4E8"/>
    <text x="18" y="31" class="box-header" fill="#2D5A27">🤝 1. พันธมิตรหลัก (Key Partners)</text>
    
    <text x="18" y="78" class="box-body">
      <tspan x="18" dy="0" font-weight="700" fill="#2D5A27">• แบรนด์แฟชั่น &amp; ซัพพลายเออร์:</tspan>
      <tspan x="28" dy="20">แบรนด์เสื้อผ้าและกระเป๋าคัดสรร</tspan>
      <tspan x="28" dy="18">สไตล์สตรีทแวร์ มินิมอล เอิร์ธโทน</tspan>
      
      <tspan x="18" dy="30" font-weight="700" fill="#2D5A27">• สไตลิสต์ &amp; Color Analysts:</tspan>
      <tspan x="28" dy="20">ผู้เชี่ยวชาญการวิเคราะห์โทนสีผิว</tspan>
      <tspan x="28" dy="18">(Spring Warm, Summer Cool,</tspan>
      <tspan x="28" dy="18"> Autumn Warm, Winter Cool)</tspan>
      
      <tspan x="18" dy="30" font-weight="700" fill="#2D5A27">• Fashion Influencers &amp; Creators:</tspan>
      <tspan x="28" dy="20">บล็อกเกอร์สาย OOTD และคุมโทนสี</tspan>
      
      <tspan x="18" dy="30" font-weight="700" fill="#2D5A27">• ผู้ให้บริการขนส่งพัสดุด่วน:</tspan>
      <tspan x="28" dy="20">Kerry Express, Flash, EMS</tspan>
      
      <tspan x="18" dy="30" font-weight="700" fill="#2D5A27">• ผู้ให้บริการระบบชำระเงิน:</tspan>
      <tspan x="28" dy="20">PromptPay QR, Visa, Mastercard</tspan>
    </text>
  </g>

  <!-- 2. Key Activities (กิจกรรมหลัก) -->
  <g transform="translate(355, 145)">
    <rect width="280" height="235" rx="18" fill="#FFFFFF" stroke="#556B2F" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="44" rx="18" fill="#F4F7F2"/>
    <rect y="26" width="280" height="18" fill="#F4F7F2"/>
    <text x="18" y="29" class="box-header" fill="#556B2F">⚡ 2. กิจกรรมหลัก (Key Activities)</text>
    
    <text x="18" y="72" class="box-body">
      <tspan x="18" dy="0" font-weight="700">• คัดสรรเสื้อผ้า กระเป๋า</tspan>
      <tspan x="28" dy="18">และจัดกลุ่มตาม Personal Color</tspan>
      <tspan x="18" dy="25" font-weight="700">• พัฒนาเว็บ Lookbook &amp; Store</tspan>
      <tspan x="28" dy="18">ระบบช้อปปิ้งที่ลื่นไหล 60fps</tspan>
      <tspan x="18" dy="25" font-weight="700">• จัดทำ Color Palette Guide</tspan>
      <tspan x="28" dy="18">คู่มือแนะนำการจับคู่ชุดและสีกระเป๋า</tspan>
    </text>
  </g>

  <!-- 3. Key Resources (ทรัพยากรหลัก) -->
  <g transform="translate(355, 395)">
    <rect width="280" height="240" rx="18" fill="#FFFFFF" stroke="#556B2F" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="44" rx="18" fill="#F4F7F2"/>
    <rect y="26" width="280" height="18" fill="#F4F7F2"/>
    <text x="18" y="29" class="box-header" fill="#556B2F">💎 3. ทรัพยากรหลัก (Key Resources)</text>
    
    <text x="18" y="72" class="box-body">
      <tspan x="18" dy="0" font-weight="700">• สต็อกสินค้าแฟชั่น &amp; กระเป๋า</tspan>
      <tspan x="28" dy="18">ที่แมปและตรวจเฉดสีเรียบร้อยแล้ว</tspan>
      <tspan x="18" dy="25" font-weight="700">• คลังภาพ Lookbook &amp; Video 2K</tspan>
      <tspan x="28" dy="18">สื่อแฟชั่นสตูดิโอความละเอียดสูง</tspan>
      <tspan x="18" dy="25" font-weight="700">• เว็บแอปพลิเคชัน MatchA Platform</tspan>
      <tspan x="28" dy="18">React 18 + Context API + Express</tspan>
    </text>
  </g>

  <!-- 4. Value Propositions (คุณค่าที่ส่งมอบ) -->
  <g transform="translate(650, 145)">
    <rect width="300" height="490" rx="18" fill="#FFFFFF" stroke="#BC5A36" stroke-width="2" filter="url(#shadow)"/>
    <rect width="300" height="48" rx="18" fill="#FBECE7"/>
    <rect y="30" width="300" height="18" fill="#FBECE7"/>
    <text x="18" y="31" class="box-header" fill="#BC5A36">🎁 4. คุณค่าที่ส่งมอบ (Value Prop.)</text>
    
    <text x="18" y="78" class="box-body">
      <tspan x="18" dy="0" font-weight="700" fill="#BC5A36">✨ ช้อปตาม Personal Color:</tspan>
      <tspan x="28" dy="20">ช่วยให้ผู้ซื้อเลือกเสื้อผ้าและกระเป๋า</tspan>
      <tspan x="28" dy="18">ที่การันตีว่า "ขับผิว ไม่ดร็อป"</tspan>
      <tspan x="28" dy="18">เข้ากับโทนสีประจำตัวของตนเอง</tspan>
      
      <tspan x="18" dy="28" font-weight="700" fill="#BC5A36">✨ สินค้าแฟชั่นคัดสรรคุมโทน:</tspan>
      <tspan x="28" dy="20">เสื้อ Boxy, ฮู้ดดี้, กางเกงลินิน,</tspan>
      <tspan x="28" dy="18">และกระเป๋าผ้าแคนวาส MatchA Style</tspan>
      
      <tspan x="18" dy="28" font-weight="700" fill="#BC5A36">✨ ประสบการณ์ Lookbook มีชีวิต:</tspan>
      <tspan x="28" dy="20">สลับ Color Swatches ได้ทันที</tspan>
      <tspan x="28" dy="18">พร้อมโมเดล Silhouette 2K Studio</tspan>
      
      <tspan x="18" dy="28" font-weight="700" fill="#BC5A36">✨ ช้อปปิ้งมั่นใจและโปร่งใส:</tspan>
      <tspan x="28" dy="20">ติดตามสถานะออเดอร์เรียลไทม์</tspan>
      <tspan x="28" dy="18">และรับส่วนลดพิเศษสำหรับสมาชิก</tspan>
    </text>
  </g>

  <!-- 5. Customer Relationships (ความสัมพันธ์กับลูกค้า) -->
  <g transform="translate(965, 145)">
    <rect width="280" height="235" rx="18" fill="#FFFFFF" stroke="#D4A338" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="44" rx="18" fill="#FFF8E6"/>
    <rect y="26" width="280" height="18" fill="#FFF8E6"/>
    <text x="18" y="29" class="box-header" fill="#8A6915">❤️ 5. ความสัมพันธ์ (Relationships)</text>
    
    <text x="18" y="72" class="box-body">
      <tspan x="18" dy="0" font-weight="700">• MatchA VIP Member Lounge</tspan>
      <tspan x="28" dy="18">ระบบสมาชิกระดับ Connoisseur</tspan>
      <tspan x="18" dy="25" font-weight="700">• สิทธิ์ซื้อสินค้าก่อนใคร 30 นาที</tspan>
      <tspan x="28" dy="18">VIP Early Drop Notifications</tspan>
      <tspan x="18" dy="25" font-weight="700">• Personal Color Guide</tspan>
      <tspan x="28" dy="18">แนะนำการเลือกคู่สีบนหน้าเว็บ</tspan>
    </text>
  </g>

  <!-- 6. Channels (ช่องทางการเข้าถึง) -->
  <g transform="translate(965, 395)">
    <rect width="280" height="240" rx="18" fill="#FFFFFF" stroke="#D4A338" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="44" rx="18" fill="#FFF8E6"/>
    <rect y="26" width="280" height="18" fill="#FFF8E6"/>
    <text x="18" y="29" class="box-header" fill="#8A6915">📢 6. ช่องทาง (Channels)</text>
    
    <text x="18" y="72" class="box-body">
      <tspan x="18" dy="0" font-weight="700">• เว็บไซต์ MatchA Online Store</tspan>
      <tspan x="28" dy="18">Web Application: matcha.vip</tspan>
      <tspan x="18" dy="25" font-weight="700">• โซเชียลมีเดีย Lookbook</tspan>
      <tspan x="28" dy="18">Instagram, TikTok, Lemon8, Pinterest</tspan>
      <tspan x="18" dy="25" font-weight="700">• VIP Drop List</tspan>
      <tspan x="28" dy="18">แจ้งเตือนผ่าน Email &amp; SMS ส่วนตัว</tspan>
    </text>
  </g>

  <!-- 7. Customer Segments (กลุ่มลูกค้าเป้าหมาย) -->
  <g transform="translate(1260, 145)">
    <rect width="280" height="490" rx="18" fill="#FFFFFF" stroke="#1A365D" stroke-width="2" filter="url(#shadow)"/>
    <rect width="280" height="48" rx="18" fill="#E9EEF5"/>
    <rect y="30" width="280" height="18" fill="#E9EEF5"/>
    <text x="18" y="31" class="box-header" fill="#1A365D">👥 7. กลุ่มลูกค้า (Customer Seg.)</text>
    
    <text x="18" y="78" class="box-body">
      <tspan x="18" dy="0" font-weight="700" fill="#1A365D">• Personal Color Enthusiasts:</tspan>
      <tspan x="28" dy="20">ผู้ที่สนใจและมองหาเสื้อผ้า/กระเป๋า</tspan>
      <tspan x="28" dy="18">ที่แมตช์เข้ากับโทนสีผิวประจำตัว</tspan>
      <tspan x="28" dy="18">(Spring, Summer, Autumn, Winter)</tspan>
      
      <tspan x="18" dy="32" font-weight="700" fill="#1A365D">• Fashion &amp; Bag Shoppers:</tspan>
      <tspan x="28" dy="20">กลุ่มคนที่ชอบเสื้อผ้าคุมโทน</tspan>
      <tspan x="28" dy="18">กระเป๋าสะพายผ้าแคนวาส และหมวก</tspan>
      <tspan x="28" dy="18">สไตล์ Minimal / Streetwear Earth Tone</tspan>
      
      <tspan x="18" dy="32" font-weight="700" fill="#1A365D">• Gen Z &amp; Millennials (18-35 ปี):</tspan>
      <tspan x="28" dy="20">ผู้ซื้อสินค้าออนไลน์ที่ต้องการ</tspan>
      <tspan x="28" dy="18">ความมั่นใจเรื่องการเลือกสี</tspan>
      <tspan x="28" dy="18">และมองหาเว็บที่ UX สวยงาม</tspan>
    </text>
  </g>

  <!-- 8. Cost Structure (โครงสร้างต้นทุน) -->
  <g transform="translate(60, 650)">
    <rect width="730" height="260" rx="18" fill="#FFFFFF" stroke="#BC5A36" stroke-width="2" filter="url(#shadow)"/>
    <rect width="730" height="46" rx="18" fill="#FBECE7"/>
    <rect y="28" width="730" height="18" fill="#FBECE7"/>
    <text x="24" y="30" class="box-header" fill="#BC5A36">💸 8. โครงสร้างต้นทุน (Cost Structure)</text>
    
    <text x="24" y="78" class="box-body">
      <tspan x="24" dy="0" font-weight="700">• ต้นทุนจัดซื้อสินค้าและสต็อก:</tspan>
      <tspan x="34" dy="20">จัดซื้อเสื้อผ้า กระเป๋าผ้าแคนวาส และบรรจุภัณฑ์รักษ์โลก (Eco Packaging) จากแบรนด์พาร์ทเนอร์</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• ค่าบริการระบบเซิร์ฟเวอร์ &amp; การบำรุงรักษา:</tspan>
      <tspan x="34" dy="20">ค่าบริการ Cloud Server, Hosting, Domain, SSL Security และการอัปเดตระบบเว็บแอปพลิเคชัน</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• ค่าการตลาดและผลิตสื่อ Lookbook:</tspan>
      <tspan x="34" dy="20">ค่าถ่ายภาพสตูดิโอ 2K, วิดีโอ Lookbook, การโปรโมต และความร่วมมือกับ Fashion Influencer</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• ค่าธรรมเนียมธุรกรรมการเงิน:</tspan>
      <tspan x="34" dy="20">ค่าบริการระบบ Payment Gateway (บัตรเครดิต, QR Code, และการชำระเงินออนไลน์)</tspan>
    </text>
  </g>

  <!-- 9. Revenue Streams (กระแสรายได้) -->
  <g transform="translate(810, 650)">
    <rect width="730" height="260" rx="18" fill="#FFFFFF" stroke="#2D5A27" stroke-width="2" filter="url(#shadow)"/>
    <rect width="730" height="46" rx="18" fill="#EBF4E8"/>
    <rect y="28" width="730" height="18" fill="#EBF4E8"/>
    <text x="24" y="30" class="box-header" fill="#2D5A27">💰 9. กระแสรายได้ (Revenue Streams)</text>
    
    <text x="24" y="78" class="box-body">
      <tspan x="24" dy="0" font-weight="700">• รายได้จากการจำหน่ายเสื้อผ้า กระเป๋า และแอกเซสซอรีส์:</tspan>
      <tspan x="34" dy="20">ยอดขายโดยตรง (D2C) ผ่านแพลตฟอร์ม MatchA Store ทั้งเสื้อผ้า Boxy, กระเป๋าแคนวาส และไอเทมคุมโทน</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• ค่าบริการจัดส่งพัสดุด่วนพิเศษ:</tspan>
      <tspan x="34" dy="20">ค่าบริการจัดส่งแบบ Express และ VIP Same-Day Delivery สำหรับลูกค้าที่ต้องการสินค้าเร่งด่วน</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• สินค้า Limited Edition &amp; Personal Color Drops:</tspan>
      <tspan x="34" dy="20">คอลเลกชันโทนสีพิเศษตามฤดูกาลและสินค้า Vault Archive สำหรับสมาชิกระดับ VIP</tspan>
      
      <tspan x="24" dy="28" font-weight="700">• ยอดขายจากการจัดเซ็ตคู่สี (Color Palette Bundles):</tspan>
      <tspan x="34" dy="20">โปรโมชันเซ็ตเสื้อคู่กระเป๋าตามโทนสีผิว พร้อมคูปองส่วนลดสมาชิก (เช่น MATCHA15)</tspan>
    </text>
  </g>

</svg>
