name: Keep Render backend awake

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check MatchA API and database
        shell: bash
        run: |
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            https://matcha-gluk.onrender.com/api/health)"

          echo "$response"
          echo "$response" | grep -q '"status":"healthy"'
          echo "$response" | grep -q '"database":"connected"'
